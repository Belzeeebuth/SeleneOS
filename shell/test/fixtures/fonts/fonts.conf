<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontconfig configuration for the Fonts app tests (shell/test/fonts.test.mjs): FONTCONFIG_FILE points here, so
  fc-list / fc-cache (and Chromium) see only the fixture fonts below ("system" fonts) plus the test HOME's own
  ~/.local/share/fonts (fonts installed by the app). The cache goes to the test HOME too: nothing is written here.
  Fonts (all SIL Open Font License 1.1, unmodified, licences next to this file):
    system/AtkinsonHyperlegible-{Regular,Bold,Italic,BoldItalic}.ttf  Braille Institute (Google Fonts)
    system/FiraMono-Regular.ttf                                        Mozilla / Telefonica (Google Fonts)
    system/LibreBaskerville[wght].ttf                                  Impallari Type (Google Fonts, variable)
    system/Sacramento-Regular.ttf                                      Astigmatic (Google Fonts)
    extra/CrimsonText-Regular.ttf                                      The Crimson Text Project Authors (not listed: installed by the tests)
    extra/Cantarell-VF.otf                                             The Cantarell Authors (GNOME; CFF2 variable, not listed)
-->
<fontconfig>
  <dir prefix="relative">system</dir>
  <dir>~/.local/share/fonts</dir>
  <cachedir>~/.cache/fontconfig</cachedir>
</fontconfig>
