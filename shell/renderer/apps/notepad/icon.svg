<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="np-page" x1="8" y1="10" x2="40" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#eef3fa"/>
      <stop offset="1" stop-color="#cfdbeb"/>
    </linearGradient>
    <linearGradient id="np-band" x1="6" y1="9" x2="42" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fb3ff"/>
      <stop offset=".55" stop-color="#2a82ec"/>
      <stop offset="1" stop-color="#1655c6"/>
    </linearGradient>
    <linearGradient id="np-ring" x1="0" y1="3.5" x2="0" y2="14.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f8fb"/>
      <stop offset=".55" stop-color="#c8d2df"/>
      <stop offset="1" stop-color="#8592a6"/>
    </linearGradient>
    <linearGradient id="np-line" x1="12" y1="0" x2="36" y2="0" gradientUnits="userSpaceOnUse">
