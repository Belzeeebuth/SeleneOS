<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="np-page" x1="10" y1="9" x2="38" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#eef3fa"/>
      <stop offset="1" stop-color="#d3deec"/>
    </linearGradient>
    <linearGradient id="np-band" x1="8" y1="8" x2="40" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fb0ff"/>
      <stop offset=".55" stop-color="#2a82ec"/>
      <stop offset="1" stop-color="#1757c9"/>
    </linearGradient>
    <linearGradient id="np-ring" x1="0" y1="3" x2="0" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset=".55" stop-color="#c9d3e0"/>
      <stop offset="1" stop-color="#8794a8"/>
    </linearGradient>
    <linearGradient id="np-line" x1="14" y1="0" x2="34" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b7fb3"/>
      <stop offset="1" stop-color="#8ea6c9"/>
    </linearGradient>
    <linearGradient id="np-shade" x1="0" y1="34" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b3a66" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b3a66" stop-opacity=".12"/>
    </linearGradient>
  </defs>
  <!-- soft drop shadow -->
  <rect x="9" y="9.6" width="32" height="35" rx="4.5" fill="#0b2a55" opacity=".18"/>
  <!-- page -->
  <rect x="8" y="8" width="32" height="35" rx="4.5" fill="url(#np-page)"/>
  <rect x="8" y="34" width="32" height="9" rx="4.5" fill="url(#np-shade)"/>
  <!-- header band -->
  <path d="M12.5 8h23A4.5 4.5 0 0 1 40 12.5V17H8v-4.5A4.5 4.5 0 0 1 12.5 8z" fill="url(#np-band)"/>
  <path d="M12.5 8.6h23a3.9 3.9 0 0 1 3.9 3.4H8.6a3.9 3.9 0 0 1 3.9-3.4z" fill="#fff" opacity=".22"/>
  <!-- binding rings -->
  <g fill="url(#np-ring)">
    <rect x="13.2" y="4" width="3.6" height="9" rx="1.8"/>
    <rect x="20.2" y="4" width="3.6" height="9" rx="1.8"/>
    <rect x="27.2" y="4" width="3.6" height="9" rx="1.8"/>
    <rect x="34.2" y="4" width="3.6" height="9" rx="1.8"/>
  </g>
  <g fill="#ffffff" opacity=".75">
    <rect x="14" y="4.8" width="1.1" height="4.2" rx=".55"/>
    <rect x="21" y="4.8" width="1.1" height="4.2" rx=".55"/>
    <rect x="28" y="4.8" width="1.1" height="4.2" rx=".55"/>
    <rect x="35" y="4.8" width="1.1" height="4.2" rx=".55"/>
  </g>
  <!-- text lines -->
  <g stroke="url(#np-line)" stroke-width="2.6" stroke-linecap="round">
    <path d="M14 23h20"/>
    <path d="M14 29h20"/>
    <path d="M14 35h12"/>
  </g>
</svg>
