    </linearGradient>
    <linearGradient id="np-shade" x1="0" y1="34" x2="0" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b3a66" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b3a66" stop-opacity=".12"/>
    </linearGradient>
  </defs>
  <!-- soft drop shadow -->
  <rect x="6.6" y="10.6" width="36" height="34.4" rx="5" fill="#0b2a55" opacity=".2"/>
