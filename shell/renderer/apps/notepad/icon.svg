  <rect x="6.4" y="9.4" width="35.2" height="33.6" rx="4.6" fill="none" stroke="#2c4f80" stroke-opacity=".14" stroke-width=".8"/>
  <!-- header band -->
  <path d="M11 9h26a5 5 0 0 1 5 5v4.6H6V14a5 5 0 0 1 5-5z" fill="url(#np-band)"/>
  <path d="M11 9.7h26a4.3 4.3 0 0 1 4.2 3.5H6.8A4.3 4.3 0 0 1 11 9.7z" fill="#fff" opacity=".24"/>
  <!-- binding rings -->
