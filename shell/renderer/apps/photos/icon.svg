<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="back" x1="8" y1="6" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc35a"/>
      <stop offset="1" stop-color="#f2557d"/>
    </linearGradient>
    <linearGradient id="sky" x1="24" y1="13" x2="24" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fdcff"/>
      <stop offset="0.55" stop-color="#3f9bf0"/>
      <stop offset="1" stop-color="#2160d4"/>
    </linearGradient>
    <linearGradient id="sun" x1="30" y1="17" x2="34" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3a8"/>
      <stop offset="1" stop-color="#ffbe2e"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="24" x2="0" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8ecff"/>
      <stop offset="1" stop-color="#6fc3f5"/>
    </linearGradient>
    <linearGradient id="near" x1="14" y1="26" x2="30" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fd3a6"/>
      <stop offset="1" stop-color="#0c8a7e"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="13" x2="0" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="8" y="13" width="35" height="28" rx="5"/></clipPath>
  </defs>
  <!-- back print, tilted -->
  <g transform="rotate(-11 22 21)">
    <rect x="5.5" y="7.5" width="32" height="26" rx="4.5" fill="url(#back)"/>
    <rect x="5.5" y="7.5" width="32" height="10" rx="4.5" fill="#ffffff" opacity="0.18"/>
  </g>
  <!-- soft depth under the front print -->
  <rect x="8.5" y="14.5" width="35" height="28" rx="5.5" fill="#0b2a66" opacity="0.22"/>
  <!-- front print: sky, sun, hills -->
  <g clip-path="url(#card)">
    <rect x="8" y="13" width="35" height="28" fill="url(#sky)"/>
    <circle cx="32.5" cy="21" r="4.2" fill="url(#sun)"/>
    <path d="M8 33.5l9.5-8.2c1-.9 2.5-.9 3.5 0L33 36l3.6-3c1-.8 2.4-.8 3.3.1L43 36v5H8z" fill="url(#far)"/>
    <path d="M8 41v-4.2l8.6-7.4c1.1-1 2.8-1 3.9 0L31.5 39l1.4 2z" fill="url(#near)"/>
    <rect x="8" y="13" width="35" height="11" fill="url(#hl)"/>
  </g>
  <rect x="8.5" y="13.5" width="34" height="27" rx="4.5" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
