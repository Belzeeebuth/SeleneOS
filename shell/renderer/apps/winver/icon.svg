  <path d="M38.5 4Q39.8 8.2 44 9.5Q39.8 10.8 38.5 15Q37.2 10.8 33 9.5Q37.2 8.2 38.5 4Z" fill="url(#star)" stroke="url(#star)" stroke-width=".6" stroke-linejoin="round"/>
