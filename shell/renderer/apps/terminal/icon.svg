<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="tm-body" x1="10" y1="8" x2="38" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#465066"/>
      <stop offset=".5" stop-color="#262d3b"/>
      <stop offset="1" stop-color="#12161e"/>
    </linearGradient>
    <linearGradient id="tm-band" x1="5" y1="8" x2="43" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fd0c0"/>
      <stop offset=".55" stop-color="#1ea0e6"/>
      <stop offset="1" stop-color="#2b6cf6"/>
    </linearGradient>
    <linearGradient id="tm-chev" x1="13" y1="20" x2="21" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e4f5"/>
    </linearGradient>
    <linearGradient id="tm-under" x1="23" y1="0" x2="35" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7be3c6"/>
      <stop offset="1" stop-color="#4cc3f0"/>
    </linearGradient>
    <linearGradient id="tm-gloss" x1="0" y1="15" x2="0" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- soft drop shadow -->
  <rect x="5.6" y="8.4" width="38" height="34" rx="6" fill="#06101f" opacity=".22"/>
  <!-- window body -->
  <rect x="5" y="7" width="38" height="34" rx="6" fill="url(#tm-body)"/>
  <!-- title band -->
  <path d="M11 7h26a6 6 0 0 1 6 6v2H5v-2a6 6 0 0 1 6-6z" fill="url(#tm-band)"/>
  <path d="M11 7.7h26a5.3 5.3 0 0 1 5.2 4.3H5.8A5.3 5.3 0 0 1 11 7.7z" fill="#fff" opacity=".22"/>
  <circle cx="36.4" cy="11" r="1.3" fill="#fff" opacity=".7"/>
  <circle cx="32.2" cy="11" r="1.3" fill="#fff" opacity=".45"/>
  <!-- inner gloss -->
  <path d="M5 15h38v8c-12 4.5-25 4-38 9.5z" fill="url(#tm-gloss)"/>
  <!-- prompt -->
  <path d="M13.2 21.2l6.4 5.3-6.4 5.3" fill="none" stroke="url(#tm-chev)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M23.4 33h11" fill="none" stroke="url(#tm-under)" stroke-width="3.4" stroke-linecap="round"/>
  <!-- edge highlight -->
  <rect x="5.5" y="7.5" width="37" height="33" rx="5.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
