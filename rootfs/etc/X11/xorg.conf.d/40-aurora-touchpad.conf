# Selene OS: touchpads tap to click by default (one finger = click, two = right click, three = middle click),
# and ignore the palm while typing. The person's own choices (Paramètres > Souris et pavé tactile) are applied
# on top with xinput at every sign-in (shell/main/ipc/inputpower.js).
Section "InputClass"
    Identifier "Selene touchpad defaults"
    MatchIsTouchpad "on"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "DisableWhileTyping" "on"
EndSection
