# Aurora OS session settings (sourced by /usr/lib/aurora/aurora-common; shell syntax).
# Uncomment to override the automatic choices.

# Electron GPU acceleration: auto (default: only with a 3D-capable GPU), on, off.
#AURORA_GPU=auto

# Screen mode forced at session start (default: unchanged; small VM screens get 1920x1080/1600x900).
#AURORA_RESOLUTION=1920x1080

# Extra Chromium/Electron switches for the shell and the sign-in screen.
#AURORA_ELECTRON_FLAGS=""
