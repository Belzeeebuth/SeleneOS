# Aurora OS: writable state for the sign-in screen (Xorg log, Electron profile).
d /var/lib/aurora-greeter 0750 _greetd _greetd -
# Aurora OS: account pictures for the sign-in screen. Home folders are private, so each desktop session
# publishes a copy of ~/.face as faces/<user>. Sticky and write-only for others (like /tmp, but not
# listable): users can only add or replace their own file; the greeter only accepts a file owned by the account.
d /var/lib/aurora 0755 root root -
d /var/lib/aurora/faces 1733 root root -
